<div class="flex">
  <div class="w-full">
    <img [src]="recipe()?.imagePath" class="h-auto max-w-full" alt="">
  </div>
</div>
<div class="flex">
  <div class="w-full text-4xl font-medium">
    <h1>{{ recipe()?.name }}</h1>
  </div>
</div>

<div class="my-2 flex">
  <div class="w-full">
    <div #manage class="relative inline-block">
      <button type="button" class="cursor-pointer rounded-md px-3 py-1.5 text-white focus:ring-4 focus:outline-none bg-blue-600 hover:bg-blue-700 focus:ring-blue-600/50 after:ml-1 after:inline-block after:border-x-4 after:border-t-4 after:border-x-transparent after:border-t-current after:align-middle"
              [attr.aria-expanded]="manageOpen()" (click)="manageOpen.set(!manageOpen())">
        Manage Recipe
      </button>
      <ul [class.hidden]="!manageOpen()" (click)="manageOpen.set(false)" class="absolute top-full left-0 z-10 mt-0.5 min-w-40 rounded-md border border-gray-300 bg-white py-2 shadow-lg">
        <li>
          <button type="button" class="block w-full cursor-pointer px-4 py-1 text-left whitespace-nowrap hover:bg-gray-100 focus:bg-gray-100 focus:outline-none" tabindex="0" (click)="addToShoppingList()">To shopping list</button>
        </li>
        <li>
          <button type="button" class="block w-full cursor-pointer px-4 py-1 text-left whitespace-nowrap hover:bg-gray-100 focus:bg-gray-100 focus:outline-none" tabindex="0">Edit recipe</button>
        </li>
        <li>
          <button type="button" class="block w-full cursor-pointer px-4 py-1 text-left whitespace-nowrap hover:bg-gray-100 focus:bg-gray-100 focus:outline-none" tabindex="0">Delete recipe</button>
        </li>
      </ul>
    </div>
  </div>
</div>

<div class="flex">
  <div class="w-full text-2xl font-medium">
    <h3>{{ recipe()?.description }}</h3>
  </div>
</div>


<div class="flex">
  <div class="w-full">
    <ul class="divide-y divide-gray-300 rounded-md border border-gray-300 bg-white">
      @for (ingredient of recipe()?.ingredients; track ingredient.name) {
        <li class="px-4 py-2">{{ ingredient.name }} ({{ ingredient.amount }})</li>
      } @empty {
        <li class="px-4 py-2 text-gray-500">No ingredients.</li>
      }
    </ul>
  </div>
</div>
