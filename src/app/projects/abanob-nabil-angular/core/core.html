<div class="-mx-3 flex flex-wrap *:w-full *:max-w-full *:shrink-0 *:px-3">
  <div class="w-full">
    <p class="mb-4">Add new server or blueprint</p>
    <label class="inline-block">Server Name :</label>
    <input type="text" class="block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-base leading-normal text-zinc-900 transition-shadow focus:border-blue-300 focus:ring-4 focus:ring-blue-600/25 focus:outline-none" #serverNameInput />
    <label class="inline-block" for="">Server Content</label>
    <input type="text" class="block w-full rounded-md border border-zinc-300 bg-white px-3 py-1.5 text-base leading-normal text-zinc-900 transition-shadow focus:border-blue-300 focus:ring-4 focus:ring-blue-600/25 focus:outline-none" #serverContentInput />
    <br />
    <hr class="my-4 opacity-25" />
    <button class="inline-block cursor-pointer rounded-md border px-3 py-1.5 text-center text-base leading-normal transition-colors focus-visible:ring-4 focus-visible:outline-none disabled:pointer-events-none disabled:opacity-65 border-blue-600 bg-blue-600 text-white hover:border-blue-700 hover:bg-blue-700 focus-visible:ring-blue-600/50" (click)="onAddServer(serverNameInput)">Add Server</button>
    <button class="inline-block cursor-pointer rounded-md border px-3 py-1.5 text-center text-base leading-normal transition-colors focus-visible:ring-4 focus-visible:outline-none disabled:pointer-events-none disabled:opacity-65 border-green-700 bg-green-700 text-white hover:border-green-800 hover:bg-green-800 focus-visible:ring-green-700/50" (click)="onAddBlueprint(serverNameInput)">
      Add Server bleuprint
    </button>
  </div>
</div>
