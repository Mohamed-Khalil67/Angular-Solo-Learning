<div class="grid grid-cols-1 gap-4">
  <!-- List Group Container -->
  <div class="flex flex-col rounded-lg border border-gray-200 bg-white shadow-sm">
    @for (user of users; track user.id) {
      <a [routerLink]="['/projects/routing/user', user.id, user.name]" class="block w-full border-b border-gray-200 px-4 py-3 text-gray-700 transition-colors hover:bg-gray-50 focus:bg-gray-100 last:border-b-0">
        {{user.name}}
      </a>
    }
  </div>
</div>
