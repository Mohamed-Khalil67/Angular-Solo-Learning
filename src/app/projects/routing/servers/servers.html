<div class="mx-auto max-w-[1100px] px-6 py-8">
  <div class="flex flex-col gap-6">
    <div class="flex flex-col overflow-hidden rounded-lg border border-slate-200 bg-white">
      @for (server of servers; track server) {
        <a
          [routerLink]="['/projects/routing/servers', server.id]"
          [queryParams]="{ allowEdit: '1', isEdit: true }"
          fragment="loading"
          class="cursor-pointer border-b border-slate-200 px-4 py-3 text-slate-700 transition-colors duration-150 last:border-b-0 hover:bg-slate-50"
          role="button"
        >
          {{ server.name }}
        </a>
      }
    </div>
    <div class="rounded-lg border border-slate-200 bg-white p-4">
<!--      <app-edit-server></app-edit-server>-->
<!--      <hr class="my-4 border-slate-200" />-->
<!--      <app-individual-server></app-individual-server>-->
    <router-outlet></router-outlet>
    </div>
  </div>
</div>
